<title>Saptaśatī Reader</title>
<meta name="description" content="Śrī Durgā Saptaśatī verse by verse — Sanskrit in Telugu and Devanagari, word-by-word meaning, English and Telugu explanations.">
<meta name="theme-color" content="#8f1d1d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saptaśatī">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Tiro+Telugu:ital@0;1&family=Ramaraja&display=swap">
<style>
/* Layout: a single reading column like a pothi leaf — rubricated ink on paper by day, lamp-light on lacquer by night.
   Sticky top bar with section + controls; verse "leaf" centred; panels below it; contents in a side sheet. */
:root{
  --paper:#f6f4f1;      /* rice paper, slight rose bias */
  --leaf:#fffdfb;       /* the verse leaf */
  --ink:#1d1715;        /* lamp-black ink */
  --ink-2:#5b4f4a;      /* secondary ink */
  --ink-3:#8b7f78;      /* captions */
  --rule:#e3dbd5;
  --kumkum:#a3221b;     /* rubric red: numbers, speakers, guru syllables */
  --kumkum-soft:#f6e3df;
  --haldi:#b07a12;      /* turmeric: learned / progress */
  --haldi-soft:#f5ead2;
  --focus:#1f5fa8;
  --f-deva:"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Sanskrit Text",serif;
  --f-telu:"Tiro Telugu","Noto Serif Telugu","Gautami",serif;
  --f-title:"Ramaraja","Tiro Telugu",serif;
  --f-body:"Gentium Book Plus","Gentium Plus","Charis SIL",Georgia,serif;
  --scale:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#17110f;--leaf:#211816;--ink:#f1e6d8;--ink-2:#c9b8a6;--ink-3:#93816f;--rule:#3a2c27;
  --kumkum:#f0826e;--kumkum-soft:#3d1d18;--haldi:#e3b45a;--haldi-soft:#3a2d14;--focus:#8ab8ff;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17110f;--leaf:#211816;--ink:#f1e6d8;--ink-2:#c9b8a6;--ink-3:#93816f;--rule:#3a2c27;
  --kumkum:#f0826e;--kumkum-soft:#3d1d18;--haldi:#e3b45a;--haldi-soft:#3a2d14;--focus:#8ab8ff;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sc{font-variant:small-caps;letter-spacing:.06em}
.wrap{max-width:46rem;margin:0 auto;padding-inline:16px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:52px}
.bar h1{flex:1;min-width:0;margin:0;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 b{color:var(--kumkum);font-weight:700}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:20px;padding:0 10px;color:var(--ink-2)}
.ib:hover{background:var(--kumkum-soft);color:var(--kumkum)}
.ib[aria-pressed="true"]{background:var(--kumkum-soft);color:var(--kumkum)}
.ib svg{width:20px;height:20px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px}
.seg button{padding:4px 10px;border-radius:999px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg .telu{font-family:var(--f-telu)} .seg .deva{font-family:var(--f-deva)}

/* ---------- home ---------- */
.home{padding-block:28px 64px}
.masthead{display:grid;gap:6px;padding-block:8px 24px;border-bottom:1px solid var(--rule)}
.masthead .script-title{font-family:var(--f-title);font-size:clamp(34px,8vw,52px);line-height:1.15;color:var(--kumkum);margin:0;text-wrap:balance}
.masthead .script-title.deva{font-family:var(--f-deva)}
.masthead p{margin:0;color:var(--ink-2);max-width:36rem}
.counts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.counts b{color:var(--ink);font-weight:700}
.continue{margin-top:18px;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--rule);background:var(--leaf);border-radius:12px;text-align:left;width:100%}
.continue:hover{border-color:var(--kumkum)}
.continue .k{font-size:13px;color:var(--ink-3)}
.continue .v{font-size:17px}
.continue .arrow{margin-left:auto;color:var(--kumkum);font-size:22px}
.group{margin-top:30px}
.group h2{margin:0 0 4px;font-size:13px;font-weight:400;color:var(--kumkum)}
.group .gsub{font-size:14px;color:var(--ink-3);margin:0 0 8px}
.slist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:2.4rem 1fr auto;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--rule);text-align:left}
.srow:hover{background:var(--leaf)}
.srow .num{font-size:22px;color:var(--kumkum);text-align:center;font-variant-numeric:tabular-nums}
.srow .num.dot{font-size:14px}
.srow .t{min-width:0}
.srow .t .s{display:block;font-size:20px;line-height:1.3}
.srow .t .s.telu{font-family:var(--f-telu)} .srow .t .s.deva{font-family:var(--f-deva)}
.srow .t .e{display:block;font-size:14px;color:var(--ink-3)}
.srow .meta{display:grid;justify-items:end;gap:4px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;line-height:1.6;white-space:nowrap}
.chip.ok{background:var(--haldi-soft);color:var(--haldi)}
.chip.txt{border:1px solid var(--rule);color:var(--ink-3)}
.lbar{width:64px;height:3px;border-radius:2px;background:var(--rule);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--haldi)}
.foot{margin-top:40px;font-size:13px;color:var(--ink-3);display:grid;gap:6px}
.foot a{color:var(--ink-2)}

/* ---------- verse view ---------- */
.verse-view{padding-block:18px 120px}
.crumb{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-3);margin-bottom:10px}
.crumb .pos{font-variant-numeric:tabular-nums}
.prog{height:2px;background:var(--rule);border-radius:1px;margin-bottom:18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--kumkum);transition:width .25s}
.leafcard{background:var(--leaf);border:1px solid var(--rule);border-radius:4px;padding:26px clamp(18px,5vw,40px) 22px;position:relative;box-shadow:0 1px 0 var(--rule)}
/* string-hole of a palm-leaf pothi: a quiet, subject-specific mark */
.leafcard::before{content:"";position:absolute;top:50%;left:10px;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;border:1px solid var(--rule);background:var(--paper)}
.rubric{display:flex;align-items:baseline;gap:10px;color:var(--kumkum);font-size:15px;margin-bottom:12px}
.rubric .spk{font-size:19px}
.rubric .spk.telu{font-family:var(--f-telu)} .rubric .spk.deva{font-family:var(--f-deva)}
.rubric .grp{font-size:14px}
.script{margin:0;white-space:pre-line;overflow-wrap:anywhere;font-size:calc(27px * var(--scale));line-height:1.75;text-wrap:pretty}
.script.telu{font-family:var(--f-telu);line-height:1.85}
.script.deva{font-family:var(--f-deva)}
.script .dn{color:var(--kumkum);white-space:nowrap}
.script.uv{font-size:calc(24px * var(--scale));color:var(--kumkum)}
.iast{margin:14px 0 0;color:var(--ink-2);font-style:italic;white-space:pre-line;font-size:calc(17px * var(--scale))}
.memo .script .ln[data-ln]{filter:blur(7px);cursor:pointer;transition:filter .2s;border-radius:4px}
.memo .script .ln[data-ln].shown{filter:none}
.memo .script .ln[data-ln]:not(.shown):hover{background:var(--kumkum-soft)}
.memohint{margin:10px 0 0;font-size:14px;color:var(--ink-3)}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.nav .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--rule);background:var(--leaf);font-size:15px}
.btn:hover{border-color:var(--kumkum);color:var(--kumkum)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--kumkum);border-color:var(--kumkum);color:#fff}
.btn.learned{background:var(--haldi-soft);border-color:transparent;color:var(--haldi)}
.btn:disabled{opacity:.4;cursor:default}

.panel{margin-top:22px;border-top:1px solid var(--rule);padding-top:16px}
.panel h3{margin:0 0 10px;font-size:13px;font-weight:400;color:var(--kumkum)}
.panel p{margin:0 0 10px;max-width:65ch}
.panel .te{font-family:var(--f-telu);font-size:18px;line-height:1.8}
.meaning .langtag{font-size:12px;color:var(--ink-3);margin-right:6px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:8px}
.w{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--leaf);min-width:0}
.w .ws{display:block;font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.w .ws.telu{font-family:var(--f-telu)} .w .ws.deva{font-family:var(--f-deva)}
.w .wi{display:block;font-size:13px;font-style:italic;color:var(--ink-3)}
.w .wm{display:block;font-size:14px;margin-top:2px}
.w .wt{display:block;font-family:var(--f-telu);font-size:15px;color:var(--ink-2)}
.pada{font-size:calc(20px * var(--scale));line-height:1.9;margin:0 0 12px;overflow-wrap:break-word}
.pada span{display:inline-block;max-width:100%}
.pada.telu{font-family:var(--f-telu)} .pada.deva{font-family:var(--f-deva)}
.pada span+span::before{content:"·";color:var(--kumkum);margin:0 .35em}
.meter{display:grid;gap:8px}
.mline{display:flex;flex-wrap:wrap;min-width:0;gap:2px 1px;align-items:flex-end;font-size:16px}
.syl{display:inline-flex;flex-direction:column;align-items:center;padding:0 2px;min-width:1.2em}
.syl i{font-style:normal;font-size:12px;line-height:1;color:var(--ink-3)}
.syl.g b{font-weight:700;color:var(--kumkum)}
.syl.g i{color:var(--kumkum)}
.syl b{font-weight:400}
.mline .gap{width:.6em}
.mline .cnt{margin-left:8px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.legend{font-size:13px;color:var(--ink-3)}
.legend b{color:var(--kumkum)}
.ctx{background:var(--haldi-soft);border-radius:10px;padding:12px 14px}
.ctx h3{color:var(--haldi)}
.empty{color:var(--ink-3);font-size:15px}
.empty b{color:var(--ink-2);font-weight:400}

/* ---------- paath (continuous) ---------- */
.paath{padding-block:22px 100px}
.paath h2{margin:0 0 4px;font-family:var(--f-title);font-weight:400;font-size:32px;color:var(--kumkum);text-wrap:balance}
.paath h2.deva{font-family:var(--f-deva)}
.paath .psub{color:var(--ink-3);font-size:14px;margin:0 0 20px}
.pre{margin:0 0 18px;padding:12px 14px;border-left:2px solid var(--kumkum);background:var(--leaf)}
.pre .lab{font-size:13px;color:var(--kumkum);display:block;margin-bottom:4px}
.pre .script{font-size:calc(20px * var(--scale))}
.pv{display:block;width:100%;text-align:left;padding:8px 0 10px;border-bottom:1px dashed var(--rule)}
.pv:hover .script{color:var(--kumkum)}
.pv .script{font-size:calc(24px * var(--scale))}
.pv .spk{display:block;color:var(--kumkum);font-size:18px}
.pv .spk.telu{font-family:var(--f-telu)} .pv .spk.deva{font-family:var(--f-deva)}
.pv.uv .script{color:var(--kumkum);font-size:calc(21px * var(--scale))}
.pnext{margin-top:28px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- sheet (contents & settings) ---------- */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:30}
.sheet{position:fixed;top:0;bottom:0;right:0;width:min(26rem,100%);background:var(--paper);z-index:31;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);border-left:1px solid var(--rule)}
.sheet h2{font-size:13px;font-weight:400;color:var(--kumkum);margin:18px 0 8px}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.sheet .row label{color:var(--ink-2)}
.sheet .close{float:right}
.toc a{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.toc a:hover{color:var(--kumkum)}
.toc a small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.toc .g{margin-top:14px;font-size:13px;color:var(--kumkum)}
input[type=range]{accent-color:var(--kumkum);width:9rem}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:40}
.loading{padding:60px 0;color:var(--ink-3);text-align:center}

/* ---------- tablet (iPad portrait and up): larger type, 44px touch targets ---------- */
@media (min-width:700px){
  body{font-size:18px}
  .wrap{max-width:50rem;padding-inline:28px}
  .ib{min-width:44px;height:44px}
  .btn{padding:11px 20px;font-size:16px;min-height:44px}
  .seg button{padding:7px 14px;font-size:15px}
  .script{font-size:calc(30px * var(--scale))}
  .iast{font-size:calc(18px * var(--scale))}
  .srow{padding-block:14px}
  .words{grid-template-columns:repeat(auto-fill,minmax(12rem,1fr))}
}
/* ---------- wide (iPad landscape, iPad Pro, laptops): two panes ---------- */
@media (min-width:1000px){
  .bar .wrap,.verse-view{max-width:84rem}
  .home{max-width:76rem}
  .groups{columns:2;column-gap:56px}
  .groups .group{break-inside:avoid;display:inline-block;width:100%}
  .vgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:44px;align-items:start}
  .vgrid.solo{grid-template-columns:minmax(0,48rem);justify-content:center}
  .vleft{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100dvh - 92px);overflow:auto;padding-bottom:8px}
  .vright{display:flex;flex-direction:column}
  .vright .meaning{order:-2}
  .vright .ctx{order:-1}
  .vright>.panel{margin-top:0;margin-bottom:24px}
  .vright>.panel.meaning{border-top:0;padding-top:4px}
  .leafcard{padding:34px 44px 28px}
  .script{font-size:calc(32px * var(--scale))}
  .paath{max-width:58rem}
  .pv .script{font-size:calc(27px * var(--scale))}
}
/* touch screens: no sticky hover colours after a tap */
@media (hover:none){
  .ib:hover{background:none;color:var(--ink-2)}
  .ib[aria-pressed="true"]:hover{background:var(--kumkum-soft);color:var(--kumkum)}
  .srow:hover{background:none}
  .btn:hover{border-color:var(--rule);color:inherit}
  .btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .pv:hover .script{color:inherit}
  .continue:hover{border-color:var(--rule)}
}
@media (max-width:520px){
  .bar .hide-s{display:none}
  .leafcard::before{display:none}
  .script{font-size:calc(23px * var(--scale))}
  .words{grid-template-columns:1fr 1fr}
}

/* ---------- motion (all gated: html[data-motion="on"] is set only when the reader allows motion) ---------- */
:root{--lampglow:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lampglow:rgb(240 170 80 / .16)}}
:root[data-theme="dark"]{--lampglow:rgb(240 170 80 / .16)}
@keyframes leafIn{from{opacity:0;transform:translateX(calc(var(--dir,0)*34px)) rotate(calc(var(--dir,0)*.6deg))}to{opacity:1;transform:none}}
@keyframes lineIn{from{opacity:0;transform:translateY(9px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes flame{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.93,1.07) skewX(2.5deg)}45%{transform:scale(1.05,.95) skewX(-2deg)}70%{transform:scale(.97,1.05) skewX(1.2deg)}}
@keyframes halo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.08)}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.14)}70%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}45%{transform:translate(var(--tx),var(--ty)) rotate(calc(var(--r)*.5)) scale(1);opacity:1}100%{transform:translate(calc(var(--tx)*1.25),calc(var(--ty) + 90px)) rotate(var(--r)) scale(.9);opacity:0}}
@keyframes fall{0%{transform:translate(0,-8vh) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(var(--tx),108vh) rotate(var(--r));opacity:.9}}
@keyframes sheetIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes barGrow{from{width:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}}
@keyframes hl{0%{text-shadow:0 0 0 transparent}40%{text-shadow:0 0 14px var(--haldi)}100%{text-shadow:0 0 0 transparent}}

.mhead{display:flex;align-items:flex-end;gap:12px}
.mhead .diya{margin-bottom:6px}
.diya{width:58px;height:58px;flex:none;overflow:visible}
.diya .flame{transform-box:fill-box;transform-origin:50% 100%}
.diya .halo{transform-box:fill-box;transform-origin:50% 50%}
html[data-motion="on"] .diya .flame{animation:flame 2.6s ease-in-out infinite}
html[data-motion="on"] .diya .halo{animation:halo 3.4s ease-in-out infinite}

html[data-motion="on"] .masthead{animation:fadeUp .6s cubic-bezier(.2,.7,.2,1) both}
html[data-motion="on"] .home .slist li{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(min(var(--i,0) * 28ms, 640ms) + 120ms)}
html[data-motion="on"] .home .group h2,html[data-motion="on"] .home .gsub{animation:fadeIn .5s both .1s}
html[data-motion="on"] .lbar i{animation:barGrow 1s cubic-bezier(.2,.7,.2,1) both .5s}

.leafcard{isolation:isolate}
.leafcard::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 0%,var(--lampglow),transparent 70%)}
html[data-motion="on"] .leafcard::after{animation:breathe 5s ease-in-out infinite}
html[data-motion="on"] .verse-view .leafcard{animation:leafIn .45s cubic-bezier(.2,.7,.2,1) both}
html[data-motion="on"] .verse-view:not(.memo) .script .ln{display:inline-block;max-width:100%;animation:lineIn .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 120ms + 140ms)}
html[data-motion="on"] .verse-view .iast{animation:fadeIn .6s both .45s}
html[data-motion="on"] .verse-view .vright>.panel{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
html[data-motion="on"] .verse-view .vright>.panel:nth-child(2){animation-delay:.08s}
html[data-motion="on"] .verse-view .vright>.panel:nth-child(3){animation-delay:.16s}
html[data-motion="on"] .verse-view .vright>.panel:nth-child(4){animation-delay:.24s}
html[data-motion="on"] .memo .script .ln.shown{animation:lineIn .4s both}
.verse-view{touch-action:pan-y pinch-zoom}
.leafcard.dragging{transition:none}
.leafcard.snap{transition:transform .25s cubic-bezier(.2,.7,.2,1),opacity .25s}

.btn.popping{animation:pop .45s cubic-bezier(.2,.7,.2,1)}
.petal{position:fixed;z-index:60;width:11px;height:15px;margin:-7px 0 0 -5px;border-radius:0 85% 0 85%;pointer-events:none;animation:burst 1s cubic-bezier(.15,.7,.3,1) forwards}
.petal.fall{top:0;margin:0;width:13px;height:17px;animation:fall linear forwards}

.pada span.hl{color:var(--kumkum)}
html[data-motion="on"] .pada span.hl{animation:hl .9s ease-out}
.w{transition:border-color .2s,transform .2s}
.w.hl{border-color:var(--kumkum)}
html[data-motion="on"] .w.hl{animation:pop .4s}

.reveal .pv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.reveal .pv.in{opacity:1;transform:none}

html[data-motion="on"] .scrim{animation:fadeIn .25s both}
html[data-motion="on"] .sheet{animation:sheetIn .3s cubic-bezier(.2,.7,.2,1) both}
html[data-motion="on"] .closing .scrim{animation:fadeOut .2s both}
html[data-motion="on"] .closing .sheet{animation:sheetOut .2s ease-in both}
html[data-motion="on"] .toast{animation:toastIn .3s both}

.done{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgb(20 10 8 / .45)}
.donecard{background:var(--leaf);border:1px solid var(--rule);border-radius:14px;max-width:26rem;width:100%;padding:26px 24px 20px;text-align:center;box-shadow:0 20px 60px rgb(0 0 0 / .25)}
.donecard .diya{width:76px;height:76px;margin:0 auto 4px;display:block}
.donecard .sc{color:var(--kumkum);font-size:13px;margin:0}
.donecard h2{font-family:var(--f-title);font-weight:400;color:var(--kumkum);font-size:28px;line-height:1.3;margin:6px 0 4px;text-wrap:balance}
.donecard h2.deva{font-family:var(--f-deva)}
.donecard p{margin:4px 0;color:var(--ink-2);font-size:15px}
.donecard .nav{justify-content:center;margin-top:16px}
html[data-motion="on"] .done{animation:fadeIn .3s both}
html[data-motion="on"] .donecard{animation:cardIn .5s cubic-bezier(.2,.7,.2,1) both .05s}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* ---------- tap a word: dictionary popup (iBooks/Kindle style) ---------- */
.tw{border-radius:5px;cursor:pointer;transition:background .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.tw:hover{background:var(--haldi-soft)}
.tw.sel{background:var(--haldi-soft);box-shadow:0 0 0 3px var(--haldi-soft)}
.tw:focus-visible{outline:2px solid var(--focus)}
.pada span.sel{background:var(--haldi-soft);border-radius:5px}
@media (hover:none){.tw:hover{background:none}.tw.sel{background:var(--haldi-soft)}}
.wpop{position:fixed;z-index:45;width:min(22rem,calc(100vw - 24px));max-height:min(70vh,30rem);overflow:auto;background:var(--leaf);color:var(--ink);border:1px solid var(--rule);border-radius:14px;box-shadow:0 14px 40px rgb(0 0 0 / .2),0 2px 6px rgb(0 0 0 / .08);padding:14px 16px 12px;overscroll-behavior:contain}
.wpop .hw{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-right:28px}
.wpop .hw b{font-weight:400;font-size:26px;line-height:1.35;color:var(--kumkum)}
.wpop .hw b.telu{font-family:var(--f-telu)} .wpop .hw b.deva{font-family:var(--f-deva)}
.wpop .hw i{color:var(--ink-3);font-size:15px}
.wpop .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:16px;color:var(--ink-3);font-size:16px}
.wpop .x:hover{background:var(--kumkum-soft);color:var(--kumkum)}
.wpop .sandhi{margin:6px 0 2px;font-size:13px;color:var(--haldi)}
.wpop .gl{border-top:1px solid var(--rule);padding:9px 0 7px;margin-top:8px}
.wpop .gl:first-of-type{margin-top:6px}
.wpop .gw{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wpop .gw span{font-size:20px;line-height:1.4}
.wpop .gw span.telu{font-family:var(--f-telu)} .wpop .gw span.deva{font-family:var(--f-deva)}
.wpop .gw em{font-size:14px;color:var(--ink-3)}
.wpop .ge{display:block;font-size:16px;margin-top:2px}
.wpop .gt{display:block;font-family:var(--f-telu);font-size:16px;color:var(--ink-2);line-height:1.6}
.wpop .none{margin:8px 0 2px;color:var(--ink-3);font-size:15px}
.wpop .more{display:block;margin-top:8px;font-size:14px;color:var(--kumkum)}
.wpop::after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;margin-left:-6px;background:var(--leaf);border:1px solid var(--rule);transform:rotate(45deg)}
.wpop.below::after{top:-7px;border-right:0;border-bottom:0}
.wpop.above::after{bottom:-7px;border-left:0;border-top:0}
.wpop.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-height:62vh;border-radius:18px 18px 0 0;border-width:1px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.wpop.sheet::after{display:none}
.wpop.sheet::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--rule)}
@keyframes popIn{from{opacity:0;transform:translateY(var(--py,6px)) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
html[data-motion="on"] .wpop{animation:popIn .18s cubic-bezier(.2,.7,.2,1) both}
html[data-motion="on"] .wpop.above{--py:-6px}
html[data-motion="on"] .wpop.sheet{animation:sheetUp .26s cubic-bezier(.2,.7,.2,1) both}

/* ---------- paath tools: chanting guide + saṃpuṭa ---------- */
.ptools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 22px;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--leaf)}
.ptools .btn{min-height:40px}
.ptools label{font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.ptools select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;max-width:15rem}
.ptools .est{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.paath .tw{cursor:inherit} .paath .tw:hover{background:none}
.paath .tw.chant{color:var(--kumkum);border-radius:4px;background-image:linear-gradient(var(--haldi-soft),var(--haldi-soft));background-repeat:no-repeat;background-size:100% 100%}
html[data-motion="on"] .paath .tw.chant{background-size:0% 100%;animation:sweep var(--d,600ms) linear forwards}
@keyframes sweep{to{background-size:100% 100%}}
.paath .tw.sung{color:var(--ink-3)}
.paath .now{box-shadow:inset 3px 0 0 var(--kumkum);background:color-mix(in srgb,var(--leaf) 70%,transparent)}
.paath .pv.now{padding-left:10px}
.samp{margin:4px 0 6px;padding:6px 12px;border-left:2px solid var(--haldi);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--haldi-soft) 55%,transparent)}
.samp .lab{display:block;font-size:12px;color:var(--haldi);margin-bottom:2px}
.samp .script{font-size:calc(19px * var(--scale));line-height:1.7}
.chantbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:0 10px 30px rgb(0 0 0 / .25);max-width:calc(100vw - 20px)}
.chantbar button{min-width:44px;height:44px;border-radius:22px;color:var(--paper);font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.chantbar button:hover{background:rgb(255 255 255 / .12)}
.chantbar .play{background:var(--kumkum);color:#fff;min-width:52px;height:52px;border-radius:26px;font-size:20px}
.chantbar .tempo{display:flex;align-items:center;gap:2px;padding:0 4px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chantbar .tempo b{min-width:3.6em;text-align:center;font-weight:400}
.chantbar .left{font-size:12px;opacity:.75;padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:520px){.chantbar .left{display:none}}
html[data-motion="on"] .chantbar{animation:toastIn .3s both}

/* ---------- today's pārāyaṇa (7-day round, after the Chandi Paath tracker) ---------- */
:root{--kali:#2a1a14;--lakshmi:#a8790c;--saraswati:#5f7896;--good:#2f7a3d;--good-soft:#e2f0e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kali:#e9d9cc;--lakshmi:#e3b341;--saraswati:#9db4cf;--good:#8cc795;--good-soft:#1e3222}}
:root[data-theme="dark"]{--kali:#e9d9cc;--lakshmi:#e3b341;--saraswati:#9db4cf;--good:#8cc795;--good-soft:#1e3222}
.todaycard{margin-top:18px;display:grid;gap:4px;padding:14px 16px;border:1px solid var(--rule);background:var(--leaf);border-radius:12px;text-align:left;width:100%}
.todaycard .k{font-size:13px;color:var(--kumkum)}
.todaycard .v{font-size:19px}
.todaycard .m{font-size:14px;color:var(--ink-3)}
.todaycard .bar{height:4px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:6px}
.todaycard .bar i{display:block;height:100%;background:var(--haldi)}
.homelinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.today{padding-block:20px 90px}
.today .card{background:var(--leaf);border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:14px}
.today .eyebrow{font-size:13px;color:var(--ink-3);font-variant:small-caps;letter-spacing:.06em}
.today .spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.dchip{border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.dchip .dn{font-size:11px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.dchip .dd{font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.dchip .dm{width:6px;height:6px;border-radius:50%}
.dchip.done{background:var(--good-soft);border-color:var(--good)} .dchip.done .dm{background:var(--good)}
.dchip.missed .dm{background:var(--haldi)}
.dchip.today{border-color:var(--kumkum)} .dchip.today .dn{color:var(--kumkum)}
.dchip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--kumkum) inset}
.hero .part{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);margin-top:8px}
.hero .part b{width:10px;height:10px;border-radius:50%}
.hero h2{font-family:var(--f-title);font-weight:400;font-size:34px;line-height:1.15;color:var(--kumkum);margin:10px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tag{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.tag.gold{border-color:transparent;background:var(--haldi-soft);color:var(--haldi)}
.tag .te{font-family:var(--f-telu)}
.steps{list-style:none;margin:8px 0 12px;padding:0;display:grid;gap:6px}
.step{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 8px 8px 6px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.step.on{background:var(--good-soft);border-color:transparent}
.step .tick{width:30px;height:30px;border-radius:15px;border:1.5px solid var(--rule);display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:15px}
.step.on .tick{background:var(--good);border-color:var(--good);color:#fff}
.step .t b{display:block;font-weight:400;font-size:16px}
.step .t small{display:block;font-size:13px;color:var(--ink-3)}
.step .t .opt{font-size:11px;padding:0 6px;border:1px solid var(--rule);border-radius:999px;margin-left:6px;color:var(--ink-3)}
.step.main{border-color:var(--kumkum)}
.step .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.step .acts .btn{padding:6px 12px;font-size:14px;min-height:36px}
.chchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chchips .btn{padding:3px 10px;font-size:13px;min-height:30px}
.chchips .btn.on{background:var(--good-soft);border-color:transparent;color:var(--good)}
.field{display:grid;gap:6px}
.field input[type=date]{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);max-width:14rem}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.quick .chip{display:grid;text-align:left;padding:6px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);font-size:14px;line-height:1.3}
.quick .chip small{color:var(--ink-3);font-size:12px}
.quick .chip[aria-pressed="true"]{border-color:var(--kumkum);color:var(--kumkum)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px}
.hist small{color:var(--ink-3)}
/* ---------- japa counter ---------- */
.japa{position:fixed;inset:0;z-index:55;background:var(--paper);display:grid;grid-template-rows:auto auto 1fr auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.japa .top{display:flex;justify-content:space-between;align-items:center}
.japa .mantra{text-align:center;margin:6px 0 0}
.japa .mantra .s{display:block;font-size:clamp(22px,6vw,34px);color:var(--kumkum);line-height:1.4}
.japa .mantra .s.telu{font-family:var(--f-telu)} .japa .mantra .s.deva{font-family:var(--f-deva)}
.japa .mantra i{color:var(--ink-3);font-size:14px}
.japa .pad{display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.japa svg.mala{width:min(84vw,62vh,520px);height:auto;overflow:visible}
.japa .bead{fill:var(--rule);transition:fill .15s}
.japa .bead.on{fill:var(--kumkum)}
.japa .meru{fill:var(--haldi)}
.japa .num{font-size:64px;fill:var(--ink);font-variant-numeric:tabular-nums}
.japa .of{font-size:16px;fill:var(--ink-3)}
.japa .rounds{font-size:15px;fill:var(--haldi)}
.japa .hint{text-align:center;color:var(--ink-3);font-size:14px;margin:4px 0 0}
.japa .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
html[data-motion="on"] .japa{animation:fadeIn .25s both}
html[data-motion="on"] .japa .bead.pulse{animation:beadPop .35s ease-out}
@keyframes beadPop{0%{transform:scale(1)}40%{transform:scale(1.9)}100%{transform:scale(1)}}
.japa .bead{transform-box:fill-box;transform-origin:center}

/* ---------- practice levels + review ---------- */
.hints{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--ink-3)}
.hints .seg button{font-size:13px;padding:4px 10px}
.mw{border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mw.hide{color:transparent;background:var(--kumkum-soft);text-shadow:none}
.mw .dots{color:var(--ink-3);letter-spacing:.08em}
.mw.shown{color:inherit;background:none}
html[data-motion="on"] .mw.shown{animation:lineIn .35s both}
.reviewbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--haldi-soft)}
.reviewbar .q{flex:1;min-width:12rem;font-size:15px;color:var(--ink-2)}
.reviewbar .btn.good{background:var(--good);border-color:var(--good);color:#fff}
.reviewcard{margin-top:10px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--rule);background:var(--leaf);border-radius:12px;text-align:left;width:100%}
.reviewcard b{font-weight:400;font-size:17px} .reviewcard small{display:block;color:var(--ink-3);font-size:13px}
.reviewcard .n{margin-left:auto;font-size:22px;color:var(--haldi);font-variant-numeric:tabular-nums}
/* ---------- share card preview ---------- */
.sharebox{position:fixed;inset:0;z-index:56;display:grid;place-items:center;padding:16px;background:rgb(20 10 8 / .55)}
.sharebox .inner{background:var(--leaf);border-radius:16px;padding:14px;max-width:min(30rem,100%);width:100%;max-height:100%;overflow:auto;display:grid;gap:12px;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
.sharebox img{width:100%;height:auto;border-radius:10px;border:1px solid var(--rule);display:block}
.sharebox .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sharebox .opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--ink-3);align-items:center}
html[data-motion="on"] .sharebox{animation:fadeIn .25s both}
html[data-motion="on"] .sharebox .inner{animation:cardIn .35s cubic-bezier(.2,.7,.2,1) both}

/* ---------- word index ---------- */
.windex{padding-block:20px 90px}
.windex h2,.story h2{font-family:var(--f-title);font-weight:400;font-size:32px;color:var(--kumkum);margin:0 0 4px}
.windex .sub,.story .sub{color:var(--ink-3);font-size:15px;margin:0 0 14px}
.wsearch{width:100%;font:inherit;font-size:18px;padding:10px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--leaf);color:var(--ink)}
.wquick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.wquick button{padding:4px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--leaf);font-size:15px}
.wlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.wlist li>button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--rule)}
.wlist .ws{font-size:21px} .wlist .ws.telu{font-family:var(--f-telu)} .wlist .ws.deva{font-family:var(--f-deva)}
.wlist .wi{font-style:italic;color:var(--ink-3);font-size:14px;margin-left:8px}
.wlist .wg{grid-column:1;font-size:15px;color:var(--ink-2)}
.wlist .wc{grid-row:1 / span 2;grid-column:2;align-self:center;font-size:14px;color:var(--haldi);font-variant-numeric:tabular-nums}
.occ{list-style:none;margin:0;padding:0}
.occ li>button{display:block;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--rule)}
.occ .r{font-size:13px;color:var(--ink-3)}
.occ .l{display:block;font-size:21px;line-height:1.6} .occ .l.telu{font-family:var(--f-telu)} .occ .l.deva{font-family:var(--f-deva)}
.occ mark{background:var(--haldi-soft);color:var(--kumkum);border-radius:4px;padding:0 2px}
.wpop .more{background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:14px;color:var(--kumkum)}
/* ---------- story map ---------- */
.story{padding-block:20px 90px}
.carita{position:relative;margin:22px 0 0;padding-left:26px}
.carita::before{content:"";position:absolute;left:8px;top:6px;bottom:0;width:2px;background:var(--cc,var(--rule));opacity:.5}
.carita>h3{margin:0 0 2px;font-size:14px;font-weight:400;color:var(--cc);font-variant:small-caps;letter-spacing:.06em}
.carita>p{margin:0 0 10px;color:var(--ink-3);font-size:14px}
.chnode{position:relative;margin:0 0 12px;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--leaf)}
.chnode::before{content:"";position:absolute;left:-24px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--cc)}

.chnode .ct{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chnode .ct b{font-size:20px;font-weight:400;color:var(--kumkum);font-variant-numeric:tabular-nums}
.chnode .ct span{font-size:18px} .chnode .ct span.telu{font-family:var(--f-telu)} .chnode .ct span.deva{font-family:var(--f-deva)}
.chnode .ct small{font-size:13px;color:var(--ink-3)}
.chnode p{margin:6px 0 8px;font-size:15px;color:var(--ink-2)}
.cast{display:flex;flex-wrap:wrap;gap:6px}
.cast button{padding:3px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-size:14px}
.cast button small{color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.cast button.dev{border-color:transparent;background:var(--haldi-soft);color:var(--haldi)}

<script>
(() => {
'use strict';
/* ---------------- state ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('ss:'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('ss:'+k, JSON.stringify(v)); }catch(e){} }
};
const prefs = Object.assign({script:'telu', mean:'both', iast:true, scale:1, theme:'system', tspell:'book', motion:'on', tempo:170, samputa:'', sampMode:'both', memoLevel:'none', shareMean:'en'}, store.get('prefs', {}));
let learned = new Set(store.get('learned', []));
let DATA = null, NOTES = {}, NOTEIDX = {};
let memo = false, paathMode = false;
const app = document.getElementById('app');

/* ---------------- IAST → Telugu / Devanagari (for word lists) ---------------- */
const V = {a:['అ','','अ',''],'ā':['ఆ','ా','आ','ा'],i:['ఇ','ి','इ','ि'],'ī':['ఈ','ీ','ई','ी'],u:['ఉ','ు','उ','ु'],'ū':['ఊ','ూ','ऊ','ू'],
  'ṛ':['ఋ','ృ','ऋ','ृ'],'ṝ':['ౠ','ౄ','ॠ','ॄ'],'ḷ':['ఌ','ౢ','ऌ','ॢ'],e:['ఏ','ే','ए','े'],ai:['ఐ','ై','ऐ','ै'],o:['ఓ','ో','ओ','ो'],au:['ఔ','ౌ','औ','ौ']};
const C = {k:['క','क'],kh:['ఖ','ख'],g:['గ','ग'],gh:['ఘ','घ'],'ṅ':['ఙ','ङ'],c:['చ','च'],ch:['ఛ','छ'],j:['జ','ज'],jh:['ఝ','झ'],'ñ':['ఞ','ञ'],
  'ṭ':['ట','ट'],'ṭh':['ఠ','ठ'],'ḍ':['డ','ड'],'ḍh':['ఢ','ढ'],'ṇ':['ణ','ण'],t:['త','त'],th:['థ','थ'],d:['ద','द'],dh:['ధ','ध'],n:['న','न'],
  p:['ప','प'],ph:['ఫ','फ'],b:['బ','ब'],bh:['భ','भ'],m:['మ','म'],y:['య','य'],r:['ర','र'],l:['ల','ल'],v:['వ','व'],'ś':['శ','श'],'ṣ':['ష','ष'],s:['స','स'],h:['హ','ह'],'ḻ':['ళ','ळ']};
const VIR = ['్','्'], ANU=['ం','ं'], VIS=['ః','ः'], AVA=['ఽ','ऽ'];
function xl(iast, script){
  const si = script==='telu'?0:1;
  let s = iast.normalize('NFC').toLowerCase().replace(/ṁ/g,'ṃ');
  /* Telugu book style: a nasal before a consonant of its own class is written as anusvāra (మంగళ, శంఖ) */
  if(si===0 && prefs.tspell!=='strict') s = s.replace(/ṅ(?=[kg])|ñ(?=[cj])|ṇ(?=[ṭḍ])|n(?=[td])|m(?=[pb])/g,'ṃ');
  if(s==='oṃ' && script==='deva') return 'ॐ';
  let out='', i=0, pend=false;
  const tok = (str,pos,dict)=>{ for(const L of [2,1]){ const t=str.substr(pos,L); if(dict[t]) return t; } return null; };
  while(i<s.length){
    const cons = tok(s,i,C);
    if(cons){ if(pend) out+=VIR[si]; out+=C[cons][si]; pend=true; i+=cons.length; continue; }
    const vow = tok(s,i,V);
    if(vow){ out += pend ? V[vow][si*2+1] : V[vow][si*2]; pend=false; i+=vow.length; continue; }
    if(pend){ out+=VIR[si]; pend=false; }
    const ch=s[i];
    if(ch==='ṃ') out+=ANU[si]; else if(ch==='ḥ') out+=VIS[si]; else if(ch==="'"||ch==='’') out+=AVA[si];
    else if(ch==='|') out+='।'; else out+=ch;
    i++;
  }
  if(pend) out+=VIR[si];
  return out;
}

/* ---------------- metre: guru/laghu from IAST ---------------- */
const LONGV = ['ai','au','ā','ī','ū','ṝ','e','o'], SHORTV=['a','i','u','ṛ','ḷ'];
const CONS = Object.keys(C).sort((a,b)=>b.length-a.length);
function syllables(line){
  const s = line.normalize('NFC').toLowerCase().replace(/[|।॥'’.,;:\-]/g,' ').replace(/ṁ/g,'ṃ');
  const units=[]; // {t:'c'|'v'|'m'|'sp', s, long}
  let i=0;
  while(i<s.length){
    if(s[i]===' '){ units.push({t:'sp'}); i++; continue; }
    let v = [...LONGV,...SHORTV].find(x=>s.startsWith(x,i));
    if(v){ units.push({t:'v',s:v,long:LONGV.includes(v)}); i+=v.length; continue; }
    if(s[i]==='ṃ'||s[i]==='ḥ'){ units.push({t:'m',s:s[i]}); i++; continue; }
    const c = CONS.find(x=>s.startsWith(x,i));
    if(c){ units.push({t:'c',s:c}); i+=c.length; continue; }
    i++;
  }
  // build syllables: onset consonants + vowel + following m
  const syl=[]; let onset='', wordBreakBefore=false;
  units.forEach(u=>{
    if(u.t==='sp'){ wordBreakBefore = true; return; }
    if(u.t==='c'){ onset+=u.s; return; }
    if(u.t==='v'){ syl.push({txt:onset+u.s, long:u.long, coda:'', brk:wordBreakBefore}); onset=''; wordBreakBefore=false; return; }
    if(u.t==='m' && syl.length){ syl[syl.length-1].txt+=u.s; syl[syl.length-1].heavyM=true; }
  });
  if(onset && syl.length){ syl[syl.length-1].txt+=onset; syl[syl.length-1].final=true; }
  // count consonants following each syllable (onset of next)
  const consCount = str => { let n=0,j=0; while(j<str.length){ const c=CONS.find(x=>str.startsWith(x,j)); if(c){n++; j+=c.length;} else break; } return n; };
  syl.forEach((x,k)=>{
    const next = syl[k+1];
    const nOn = next ? consCount(next.txt) : 0;
    x.guru = x.long || x.heavyM || x.final || nOn>=2;
  });
  return syl;
}

function metreNote(counts){
  const all = (...ns) => counts.length>0 && counts.every(c=>ns.includes(c));
  if(all(16)) return 'Metre: anuṣṭubh, 8 syllables a quarter, 16 a line.';
  if(all(8)) return 'Metre: anuṣṭubh, 8 syllables a quarter.';
  if(all(14,28)) return 'Metre: vasantatilakā, 14 syllables a quarter (– – ∪ – ∪ ∪ ∪ – ∪ ∪ – ∪ – –).';
  if(all(19,38)) return 'Metre: śārdūlavikrīḍita, 19 syllables a quarter.';
  if(all(21,42)) return 'Metre: sragdharā, 21 syllables a quarter.';
  if(all(11,22)) return 'Metre: triṣṭubh, 11 syllables a quarter.';
  return 'Keep each quarter of the verse steady; long syllables get two beats.';
}

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = (sel, el=document) => el.querySelector(sel);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1600); }
/* ---------------- motion ---------------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const motionOK = () => prefs.motion!=='off' && !RM.matches;
let navDir = 0, lastProg = null;
const DIYA = `<svg class="diya" viewBox="0 0 64 64" aria-hidden="true"><defs>
  <radialGradient id="dgH" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffcf73" stop-opacity=".6"/><stop offset="1" stop-color="#ffcf73" stop-opacity="0"/></radialGradient>
  <linearGradient id="dgF" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d4471c"/><stop offset=".5" stop-color="#f29e33"/><stop offset="1" stop-color="#fff0b8"/></linearGradient></defs>
  <circle class="halo" cx="32" cy="24" r="20" fill="url(#dgH)"/>
  <path class="flame" d="M32 6c5 8 8 15 0 26c-8-11-5-18 0-26z" fill="url(#dgF)"/>
  <path d="M32 30v5" stroke="var(--ink-2)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M9 37c3 12 43 12 46 0z" fill="var(--kumkum)"/>
  <path d="M7 37h50" stroke="var(--haldi)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M25 49h14l-2.5 6h-9z" fill="var(--kumkum)" opacity=".8"/></svg>`;
const PETALS = ['#f0a12b','#f6c64f','#e0661f','#c8321f','#f9dd75','#e88a2d'];
function petals(x, y, n=16){
  if(!motionOK()) return;
  for(let i=0;i<n;i++){
    const p=document.createElement('i'); p.className='petal';
    const a = (-170 + Math.random()*160) * Math.PI/180, d = 50 + Math.random()*90;
    p.style.cssText = `left:${x}px;top:${y}px;--tx:${(Math.cos(a)*d).toFixed(1)}px;--ty:${(Math.sin(a)*d).toFixed(1)}px;--r:${(Math.random()*540-270).toFixed(0)}deg;background:${PETALS[i%PETALS.length]};animation-duration:${(850+Math.random()*450).toFixed(0)}ms`;
    p.addEventListener('animationend', ()=>p.remove()); document.body.appendChild(p);
  }
}
function shower(n=46){
  if(!motionOK()) return;
  for(let i=0;i<n;i++){
    const p=document.createElement('i'); p.className='petal fall';
    p.style.cssText = `left:${(Math.random()*100).toFixed(1)}vw;--tx:${(Math.random()*120-60).toFixed(0)}px;--r:${(Math.random()*720-360).toFixed(0)}deg;background:${PETALS[i%PETALS.length]};animation-duration:${(2600+Math.random()*1800).toFixed(0)}ms;animation-delay:${(Math.random()*1300).toFixed(0)}ms`;
    p.addEventListener('animationend', ()=>p.remove()); document.body.appendChild(p);
  }
}
function countUp(root){
  if(!motionOK()) return;
  root.querySelectorAll('[data-n]').forEach(el=>{
    const to=+el.dataset.n; if(!to) return; const t0=performance.now(), dur=900;
    const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e); if(k<1) requestAnimationFrame(step); };
    el.textContent='0'; requestAnimationFrame(step);
  });
}
/* theme change: the new theme spreads out in a circle from the tapped button (View Transitions where supported) */
function withReveal(ev, fn){
  if(!motionOK() || !document.startViewTransition){ fn(); return; }
  const x = ev ? ev.clientX : innerWidth/2, y = ev ? ev.clientY : 0;
  const r = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y));
  const vt = document.startViewTransition(fn);
  vt.ready.then(()=>{
    document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},
      {duration:650, easing:'cubic-bezier(.2,.7,.2,1)', pseudoElement:'::view-transition-new(root)'});
  }).catch(()=>{});
}
function applyPrefs(){
  document.documentElement.style.setProperty('--scale', prefs.scale);
  document.documentElement.dataset.motion = motionOK() ? 'on' : 'off';
  if(prefs.theme==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', prefs.theme);
  document.querySelectorAll('[data-script]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.script===prefs.script));
  store.set('prefs', prefs);
}
const teluBook = t => prefs.tspell==='strict' ? t : t.replace(/ఙ్(?=[కఖగఘ])|ఞ్(?=[చఛజఝ])|ణ్(?=[టఠడఢ])|న్(?=[తథదధ])|మ్(?=[పఫబభ])/g,'ం');
const scriptOf = obj => prefs.script==='telu' ? teluBook(obj.telu||'') : obj[prefs.script];
const sec = id => DATA.sections[id];

/* entries for a section: preamble blocks + verses, refs resolved */
const PRE_LABEL = {viniyoga:'Viniyoga', dhyanam:'Dhyānam', namaskara:'Namaskāra', invocation:'Invocation'};
function entries(id){
  const s = sec(id);
  if(s.kind==='ref'){
    const r = s.ref, base = sec(r.section);
    const vs = base.verses.filter(v => r.from==null || (v.n>=r.from && v.n<=r.to));
    return vs.map(v=>({...v, _src:r.section}));
  }
  return [...s.preamble.map((p,i)=>({...p, kind:'pre', ref:'pre'+i, _pre:true})), ...s.verses.map(v=>({...v,_src:id}))];
}
function refLabel(sid, e){
  if(e._pre) return PRE_LABEL[e.label]||e.label;
  if(e.kind==='ritual') return e.group;
  return e.ref;
}
function entryToken(e, i){ return e._pre ? 'p'+e.ref.slice(3) : (e.n!=null ? String(e.n) : String(i)); }
function sectionHash(sid, idx){
  if(idx==null) return '#'+sid;
  const e = entries(sid)[idx];
  return '#' + sid + '.' + (e ? entryToken(e, idx) : idx);
}
function indexFor(sid, tok){
  const list = entries(sid);
  if(/^p\d+$/.test(tok)){ const k = list.findIndex(e=>e._pre && e.ref==='pre'+tok.slice(1)); return k<0?0:k; }
  const n = parseInt(tok,10); if(isNaN(n)) return 0;
  const k = list.findIndex(e=>!e._pre && e.n<=n && (e.n_end||e.n)>=n);
  return k<0 ? 0 : k;
}

/* ---------------- notes ---------------- */
async function loadNotes(id){
  const src = sec(id).kind==='ref' ? sec(id).ref.section : id;
  if(NOTES[src]!==undefined) return NOTES[src];
  if(!NOTEIDX[src]) { NOTES[src]=null; return null; }
  try{ const r = await fetch('data/notes/'+src+'.json'); NOTES[src] = r.ok ? await r.json() : null; }
  catch(e){ NOTES[src]=null; }
  return NOTES[src];
}
function ctxFor(notes, list, idx){
  if(!notes) return null;
  for(let k=idx;k>=0;k--){ const n = notes[list[k].ref]; if(n && n.ctx) return {ctx:n.ctx, at:list[k].ref, same:k===idx}; }
  return notes._intro ? {ctx:notes._intro, at:null, same:false} : null;
}

/* ---------------- views ---------------- */
function title(s){ return s.title; }
function scriptTitle(s){
  const T = {kavacham:'devīkavacam',argala:'argalāstotram',kilakam:'kīlakastotram',dhyanam:'śrīcaṇḍikādhyānam','ratri-vedic':'vedoktarātrisūktam','ratri-tantric':'tantroktarātrisūktam',atharvashirsha:'devyatharvaśīrṣam',navarna:'navārṇavidhiḥ','saptashati-nyasa':'saptaśatīnyāsaḥ',
    ch1:'prathamo\'dhyāyaḥ',ch2:'dvitīyo\'dhyāyaḥ',ch3:'tṛtīyo\'dhyāyaḥ',ch4:'caturtho\'dhyāyaḥ',ch5:'pañcamo\'dhyāyaḥ',ch6:'ṣaṣṭho\'dhyāyaḥ',ch7:'saptamo\'dhyāyaḥ',ch8:'aṣṭamo\'dhyāyaḥ',ch9:'navamo\'dhyāyaḥ',ch10:'daśamo\'dhyāyaḥ',ch11:'ekādaśo\'dhyāyaḥ',ch12:'dvādaśo\'dhyāyaḥ',ch13:'trayodaśo\'dhyāyaḥ',

function scriptHTML(e, cls='', tap=false){

  const words = l => !tap ? esc(l) : l.split(/(\s+)/).map(part => {

  }).join('');

}

let popEl = null, popFor = null;

function placePop(){
  if(!popEl || !popFor) return;

  if(r.bottom < 0 || r.top > innerHeight){ closePop(); return; }

    toks.forEach((tk,i)=>{
      const el = block.querySelector(`.tw[data-t="${i}"]`);
      if(el) seq.push({el, beats:beatsOf(tk), block});
      else if(/\|\||॥/.test(tk)) seq.push({pause:4, block});

function beatsLeft(){ if(!chant) return 0; let b=0; for(let k=chant.i;k<chant.seq.length;k++){ const x=chant.seq[k]; b += x.pause||x.beats; } return b; }
function fmtMin(beats){ const m = beats/prefs.tempo; return m < 1 ? '< 1 min' : `≈ ${Math.round(m)} min`; }
function chantBar(){

  if(!bar){ bar = document.createElement('div'); bar.className='chantbar'; bar.setAttribute('role','toolbar'); bar.setAttribute('aria-label','Chanting guide'); document.body.appendChild(bar);

    bar.addEventListener('click', ev=>{ const b=ev.target.closest('[data-c]'); if(!b) return; const c=b.dataset.c;
      if(c==='play') chant.playing ? pauseChant() : playChant();

function markBlock(block){ if(chant.block===block) return; if(chant.block){ chant.block.classList.remove('now'); chant.block.querySelectorAll('.sung,.chant').forEach(x=>x.classList.remove('sung','chant')); } chant.block=block; if(block) block.classList.add('now'); }

  const r = el.getBoundingClientRect(), top = innerHeight*0.22, bot = innerHeight*0.62;

}
function tick(){
  if(!chant || !chant.playing) return;
  const it = chant.seq[chant.i];
  if(!it){ const box = app.querySelector('.paath'), sidDone = box && box.dataset.sid; stopChant(); if(sidDone) nextSection(sidDone, true); else toast('॥ Chanting complete ॥'); return; }
  markBlock(it.block);
  if(chant.cur){ chant.cur.classList.remove('chant'); chant.cur.classList.add('sung'); chant.cur=null; }
  const ms = (it.pause || it.beats) * 60000 / prefs.tempo;
  if(it.el){ it.el.style.setProperty('--d', ms+'ms'); it.el.style.animationPlayState=''; it.el.classList.remove('sung'); void it.el.offsetWidth; it.el.classList.add('chant'); chant.cur = it.el; keepInView(it.el); }

function startChant(root, ents, fromBlock){

function jumpTo(block){ if(!chant) return; const k = chant.seq.findIndex(x=>x.block===block); if(k<0) return; clearTimeout(chant.timer); if(chant.cur){ chant.cur.classList.remove('chant'); chant.cur=null; } markBlock(null); chant.i=k; if(chant.playing) tick(); else { markBlock(block); keepInView(block); } chantBar(); }
function jumpBlock(d){ if(!chant) return; const blocks=[...new Set(chant.seq.map(x=>x.block))]; const cur = blocks.indexOf(chant.block); const nb = blocks[Math.max(0, Math.min(blocks.length-1, (cur<0?0:cur)+d))]; jumpTo(nb); }

/* ================= Practice levels + spaced review ================= */
const BOX_DAYS = [1,3,7,16,35];
let srs = null;
function S(){ if(!srs){ srs = store.get('srs', null); if(!srs){ srs = {}; [...learned].forEach(k=>{ srs[k] = {box:0, due:todayD()}; }); store.set('srs', srs); } } return srs; }
const saveSrs = () => store.set('srs', S());
function srsAdd(k){ S(); if(!srs[k]){ srs[k] = {box:0, due:addD(todayD(), BOX_DAYS[0])}; saveSrs(); } }
function srsDrop(k){ S(); if(srs[k]){ delete srs[k]; saveSrs(); } }
function srsAnswer(k, ok){
  S(); const c = srs[k] || {box:0};
  c.box = ok ? Math.min(BOX_DAYS.length-1, c.box + 1) : 0;
  c.due = addD(todayD(), BOX_DAYS[c.box]);
  srs[k] = c; saveSrs(); return BOX_DAYS[c.box];
}
const dueKeys = () => Object.keys(S()).filter(k=>srs[k].due <= todayD()).sort((a,b)=>srs[a].due < srs[b].due ? -1 : 1);
let reviewQ = null;   /* {keys:[], i:0, ok:0} while reviewing */
function keyToHash(k){
  const [sid, ref] = k.split(':'); const list = entries(sid); if(!list) return null;
  const i = list.findIndex(e=>e.ref===ref && !e._pre) ; const j = i>=0 ? i : list.findIndex(e=>e.ref===ref);
  return j>=0 ? sectionHash(sid, j) : null;
}
function startReview(){
  const keys = dueKeys().filter(k=>keyToHash(k)); if(!keys.length){ toast('Nothing due for review today'); return; }
  reviewQ = {keys, i:0, ok:0}; memo = true; go(keyToHash(keys[0]));
}
function reviewNext(){
  reviewQ.i++;
  if(reviewQ.i >= reviewQ.keys.length){ const r = reviewQ; reviewQ = null; memo = false; toast(`Review done · ${r.ok} of ${r.keys.length} remembered`); if(r.ok) shower(Math.min(40, 10 + r.ok*3)); go('#'); return; }
  go(keyToHash(reviewQ.keys[reviewQ.i]));
}
function reviewCardHTML(){
  const n = dueKeys().length, total = Object.keys(S()).length;
  if(!total) return '';
  return `<button class="reviewcard" id="reviewBtn"><span><b>${n ? 'Review learned verses' : 'All reviews done for today'}</b><small>${n ? 'Recite from memory, then check' : `${total} verses in your review cycle`}</small></span><span class="n">${n||'✓'}</span></button>`;
}
const graphemes = w => { try{ return [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(w)].map(x=>x.segment); }catch(e){ return [...w]; } };
function memoHTML(e){
  const lv = prefs.memoLevel, txt = scriptOf(e) || '', lines = txt.split('\n');
  const ref = !e._pre && e.kind!=='ritual' && e.kind!=='uvacha' ? ` <span class="dn">॥ ${esc(e.ref)} ॥</span>` : '';
  if(lv==='none') return `<p class="script ${prefs.script}">${lines.map((l,i)=>`<span class="ln" data-ln="${i}">${esc(l)}${i===lines.length-1?ref:''}</span>`).join('\n')}</p>`;
  let w = 0;
  const word = part => {
    if(!part || /^\s+$/.test(part) || /^[।॥|\d.]+$/.test(part)) return esc(part);
    const i = w++;
    if(lv==='all') return esc(part);
    if(lv==='half' && i % 2 === 0) return esc(part);
    if(lv==='first'){ const g = graphemes(part); return `<span class="mw" data-full="${esc(part)}">${esc(g[0])}<span class="dots">${'·'.repeat(Math.min(4, Math.max(1, g.length-1)))}</span></span>`; }
    return `<span class="mw hide" data-full="${esc(part)}">${esc(part)}</span>`;
  };
  return `<p class="script ${prefs.script}">${lines.map((l,i)=>`<span class="ln">${l.split(/(\s+)/).map(word).join('')}${i===lines.length-1?ref:''}</span>`).join('\n')}</p>`;
}

/* ================= Share a verse as an image ================= */
async function shareCard(sid, e, n){
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const dark = document.documentElement.dataset.theme==='dark' || (prefs.theme==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
  const P = dark ? {bg:'#1c1412', leaf:'#241a17', ink:'#f1e6d8', ink2:'#c9b8a6', red:'#f0826e', gold:'#e3b45a', rule:'#3a2c27'}
                 : {bg:'#f3eee8', leaf:'#fffdfa', ink:'#1d1715', ink2:'#5b4f4a', red:'#a3221b', gold:'#b07a12', rule:'#e3d8cf'};
  const fScript = prefs.script==='telu' ? '"Tiro Telugu"' : '"Tiro Devanagari Sanskrit"', fBody = '"Gentium Book Plus"', fTe = '"Tiro Telugu"';
  try{ await Promise.all([`40px ${fScript}`, `30px ${fBody}`, `italic 28px ${fBody}`, `28px ${fTe}`].map(f=>document.fonts.load(f))); }catch(err){}
  g.fillStyle = P.bg; g.fillRect(0,0,W,H);
  const M = 70; g.fillStyle = P.leaf; g.strokeStyle = P.rule; g.lineWidth = 2;
  g.beginPath(); g.roundRect ? g.roundRect(M, M, W-2*M, H-2*M, 26) : g.rect(M, M, W-2*M, H-2*M); g.fill(); g.stroke();
  g.strokeStyle = P.red; g.lineWidth = 3; g.beginPath(); g.moveTo(M+60, M+150); g.lineTo(W-M-60, M+150); g.stroke();
  /* small diya */
  g.save(); g.translate(W/2-32, M+28); g.scale(1,1);
  const fl = g.createLinearGradient(0,32,0,6); fl.addColorStop(0,'#d4471c'); fl.addColorStop(.5,'#f29e33'); fl.addColorStop(1,'#fff0b8');
  g.fillStyle = fl; g.fill(new Path2D('M32 6c5 8 8 15 0 26c-8-11-5-18 0-26z'));
  g.fillStyle = P.red; g.fill(new Path2D('M9 37c3 12 43 12 46 0z')); g.strokeStyle = P.gold; g.lineWidth = 2.4; g.stroke(new Path2D('M7 37h50')); g.restore();
  g.textAlign = 'center'; g.fillStyle = P.red; g.font = `30px ${fBody}`;
  const head = `Śrī Durgā Saptaśatī  ·  ${title(sec(e._src||sid))}${/^\d/.test(e.ref)?'  ·  '+e.ref:''}`;
  g.fillText(head, W/2, M+122);
  const wrap = (text, font, maxW, lh, color, y, maxLines=99) => {
    g.font = font; g.fillStyle = color; const out = [];
    text.split('\n').forEach(par=>{ let line=''; par.split(/\s+/).forEach(wd=>{ const t = line ? line+' '+wd : wd; if(g.measureText(t).width > maxW && line){ out.push(line); line = wd; } else line = t; }); if(line) out.push(line); });
    out.slice(0,maxLines).forEach((l,i)=>g.fillText(i===maxLines-1 && out.length>maxLines ? l+' …' : l, W/2, y + i*lh));
    return y + Math.min(out.length,maxLines)*lh;
  };
  const verse = (scriptOf(e)||'').replace(/ ?[|।]+ ?$/gm,'').trim();
  let size = 54; const lines = verse.split('\n').length; if(lines>4) size = 44; if(lines>6) size = 38;
  let y = M + 240;
  y = wrap(verse, `${size}px ${fScript}`, W-2*M-110, size*1.55, P.ink, y, 10);
  if(/^\d/.test(e.ref)){ g.font = `34px ${fBody}`; g.fillStyle = P.red; g.fillText(`॥ ${e.ref} ॥`, W/2, y+10); y += 60; } else y += 20;
  g.strokeStyle = P.rule; g.lineWidth = 2; g.beginPath(); g.moveTo(W/2-90, y); g.lineTo(W/2+90, y); g.stroke(); y += 64;
  const mean = prefs.shareMean;
  if(n && (mean==='en'||mean==='both') && n.en) y = wrap(n.en.replace(/^'|'$/g,''), `30px ${fBody}`, W-2*M-130, 44, P.ink2, y, mean==='both'?5:9) + 18;
  if(n && (mean==='te'||mean==='both') && n.te) y = wrap(n.te.replace(/^'|'$/g,''), `29px ${fTe}`, W-2*M-130, 50, P.ink2, y, mean==='both'?5:9);
  g.font = `24px ${fBody}`; g.fillStyle = P.gold; g.fillText('balendus.github.io/saptashathi', W/2, H-M-36);
  const blob = await new Promise(r=>c.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob), fname = `saptashati-${(e.ref||'verse').replace(/[^\w.-]/g,'')}.png`;
  const box = document.createElement('div'); box.className = 'sharebox'; box.setAttribute('role','dialog'); box.setAttribute('aria-label','Share this verse');
  const canFiles = (()=>{ try{ return navigator.canShare && navigator.canShare({files:[new File([blob], fname, {type:'image/png'})]}); }catch(err){ return false; } })();
  box.innerHTML = `<div class="inner"><img src="${url}" alt="Verse card for ${esc(e.ref)}">
    <div class="opts">Meaning on the card: <span class="seg">${[['en','English'],['te','తెలుగు'],['both','Both'],['none','None']].map(([v,l])=>`<button data-sm="${v}" aria-pressed="${prefs.shareMean===v}">${l}</button>`).join('')}</span></div>
    <div class="row">${canFiles?'<button class="btn primary" data-s="share">Share…</button>':''}<button class="btn ${canFiles?'':'primary'}" data-s="save">Save image</button><button class="btn" data-s="close">Close</button></div></div>`;
  document.body.appendChild(box);
  const close = ()=>{ box.remove(); URL.revokeObjectURL(url); };
  box.addEventListener('click', async ev=>{
    if(ev.target===box) return close();
    const sm = ev.target.closest('[data-sm]'); if(sm){ prefs.shareMean = sm.dataset.sm; store.set('prefs',prefs); close(); shareCard(sid, e, n); return; }
    const b = ev.target.closest('[data-s]'); if(!b) return;
    if(b.dataset.s==='close') close();
    if(b.dataset.s==='save'){
      let dl = null; try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(err){}
      if(dl){ try{ await dl.save({filename:fname, data:blob}); toast('Image saved'); }catch(err){ if(err && err.code!=='declined') toast('Saving is not available here'); } }
      else { const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); }
    }
    if(b.dataset.s==='share'){ try{ await navigator.share({files:[new File([blob], fname, {type:'image/png'})], title:'Śrī Durgā Saptaśatī '+e.ref}); }catch(err){} }

  for(let i=0;i<N;i++){ const a = -Math.PI/2 + (i+0.5)*2*Math.PI/N; beads += `<circle class="bead" data-b="${i}" cx="${(cx+R*Math.cos(a)).toFixed(1)}" cy="${(cy+R*Math.sin(a)).toFixed(1)}" r="4.6"/>`; }
  root.innerHTML = `<div class="top"><button class="btn" data-j="close">✕ Close</button><span style="font-size:14px;color:var(--ink-3)">Navārṇa japa</span><button class="btn" data-j="reset">Reset</button></div>
    <p class="mantra"><span class="s ${prefs.script}">${esc(xl(iast, prefs.script))}</span><i>${esc(iast)}</i></p>
    <div class="pad" tabindex="0" aria-label="Tap to count"><svg class="mala" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="${R}" fill="none" stroke="var(--rule)" stroke-width="1"/>${beads}<circle class="meru" cx="200" cy="${200-R-14}" r="9"/>
      <text class="num" x="200" y="212" text-anchor="middle">0</text><text class="of" x="200" y="244" text-anchor="middle">of ${N}</text><text class="rounds" x="200" y="150" text-anchor="middle"></text></svg></div>
    <div><p class="hint">Tap anywhere on the mālā (or press Space) for each repetition.</p><div class="row" style="margin-top:8px"><button class="btn" data-j="undo">− 1</button>${opts.onDone?'<button class="btn primary" data-j="done">Done · tick the step</button>':''}</div></div>`;
  document.body.appendChild(root);
  let wl=null; try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(x=>wl=x).catch(()=>{}); }catch(e){}
  const draw = (pulse) => {
    root.querySelector('.num').textContent = japaState.n;
    root.querySelector('.rounds').textContent = japaState.rounds ? `mālā ${japaState.rounds+1}` : '';
    root.querySelectorAll('.bead').forEach((b,i)=>b.classList.toggle('on', i < japaState.n));
    if(pulse!=null && motionOK()){ const b=root.querySelector(`.bead[data-b="${pulse}"]`); if(b){ b.classList.remove('pulse'); void b.getBoundingClientRect(); b.classList.add('pulse'); } }
    store.set('japa', japaState);
  };
  const inc = () => {
    japaState.n++;
    if(japaState.n >= N){ japaState.n = 0; japaState.rounds++; draw(); try{ navigator.vibrate && navigator.vibrate([60,40,60,40,120]); }catch(e){}
      const m=root.querySelector('.meru').getBoundingClientRect(); petals(m.left+m.width/2, m.top+m.height/2, 26); toast(`${N} complete · mālā ${japaState.rounds}`); return; }
    try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
    draw(japaState.n-1);
  };
  const close = () => { root.remove(); document.removeEventListener('keydown', key, true); try{ wl && wl.release(); }catch(e){} };
  const key = ev => { if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); ev.stopPropagation(); inc(); } if(ev.key==='Escape'){ ev.stopPropagation(); close(); } };
  document.addEventListener('keydown', key, true);
  root.querySelector('.pad').addEventListener('pointerdown', ev=>{ ev.preventDefault(); inc(); });
  root.addEventListener('click', ev=>{ const b=ev.target.closest('[data-j]'); if(!b) return; const j=b.dataset.j;
    if(j==='close') close();
    if(j==='reset'){ japaState={n:0, rounds:0}; draw(); }
    if(j==='undo'){ if(japaState.n>0) japaState.n--; else if(japaState.rounds>0){ japaState.rounds--; japaState.n=N-1; } draw(); }
    if(j==='done'){ close(); opts.onDone && opts.onDone(); } });
  draw();
}

let WIDX = null, WMAP = null;
async function loadWidx(){ if(WIDX) return WIDX; WIDX = await fetch('data/wordindex.json').then(r=>r.json()); WMAP = new Map(WIDX.map(e=>[e[0], e])); return WIDX; }
const fold = x => x.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]/g,'');
function occLine(sid, ref, ti){
  const e = (sec(sid).verses.find(v=>v.ref===ref)) || (sec(sid).preamble||[])[+String(ref).replace('pre','')];
  if(!e) return '';
  const txt = scriptOf(e) || ''; let t = 0, out = '';
  for(const line of txt.split('\n')){
    let has = false;
    const html = line.split(/(\s+)/).map(part=>{ if(!part || /^\s+$/.test(part)) return part; const i = t++; if(i===ti){ has = true; return `<mark>${esc(part)}</mark>`; } return esc(part); }).join('');
    if(has || (ti<0 && !out)) out = html;
  }
  return out || esc(txt.split('\n')[0]);
}
function refHash(sid, ref){ const list = entries(sid); const i = list.findIndex(e=>e.ref===ref); return i>=0 ? sectionHash(sid, i) : '#'+sid; }
async function renderWords(q){

    scrollTo(0,0); return;
  }
  const NAMES = ['devī','caṇḍikā','ambikā','durgā','kālī','cāmuṇḍā','nārāyaṇi','śivā','bhagavatī','parameśvarī','mahāmāyā','kātyāyanī','śaraṇye','namaḥ'];
  app.innerHTML = `<div class="wrap windex"><h2>Word index</h2><p class="sub">Every glossed word in the text, with the verses where it appears. Type in Roman letters (accents optional), e.g. <i>durga</i>, <i>mahis</i>, <i>sarva</i>.</p>
    <input class="wsearch" id="wq" type="search" placeholder="Search a word…" autocomplete="off" value="${esc(q||'')}">
    <div class="wquick">${NAMES.filter(n=>WMAP.has(n)).map(n=>`<button data-go="#words/${encodeURIComponent(n)}" class="${prefs.script}">${esc(xl(n, prefs.script))}</button>`).join('')}</div>
    <ul class="wlist" id="wl"></ul></div>`;
  const inp = $('#wq'), wl = $('#wl');

    const res = (f ? WIDX.filter(e=>fold(e[0]).startsWith(f)) : WIDX).slice(0, 80);
    wl.innerHTML = res.map((e,i)=>`<li style="--i:${i}"><button data-go="#words/${encodeURIComponent(e[0])}"><span><span class="ws ${prefs.script}">${esc(xl(e[0], prefs.script))}</span><span class="wi">${esc(e[0])}</span></span><span class="wg">${esc(prefs.mean==='te'?e[2]:e[1])}</span><span class="wc">${e[3].length}</span></button></li>`).join('') || '<li style="padding:12px 4px;color:var(--ink-3)">No glossed word starts with that.</li>';
  };
  inp.addEventListener('input', show); show(); scrollTo(0,0);
  if(!matchMedia('(hover:none)').matches) inp.focus();

let KIDX = null; const PROSE = {};
async function loadKidx(){ if(KIDX) return KIDX; KIDX = await fetch('data/prose/index.json').then(r=>r.json()); return KIDX; }
async function loadProse(sid){ if(PROSE[sid]) return PROSE[sid]; return PROSE[sid] = await fetch('data/prose/'+sid+'.json').then(r=>r.json()); }
const kMean = () => prefs.kmean || prefs.mean;
function kRange(sid, p){
  const list = entries(sid), a = list.findIndex(e=>e.ref===p.from), b = list.findIndex(e=>e.ref===(p.to||p.from));
  const es = list.slice(a, b+1), vs = es.filter(e=>!e._pre);
  const opening = es.length > vs.length;
  let lab = vs.length ? (vs.length>1 ? `${vs[0].ref}–${vs[vs.length-1].ref.split('.')[1]}` : vs[0].ref) : '';
  lab = opening ? (lab ? 'Opening · '+lab : 'Opening') : 'Verses '+lab;
  if(!opening && vs.length===1) lab = 'Verse '+vs[0].ref;
  return {es, a, lab};

const smart = t => t.replace(/(^|[\s(\[—])"/g,'$1“').replace(/"/g,'”').replace(/(^|[\s(\[—“])'/g,'$1‘').replace(/'/g,'’');

  if(h==='story') return renderStory();
  if(h==='katha') return renderKathaIndex();
  if(h.startsWith('katha/')){ const [, ks, ki] = h.split('/'); if(/^ch([1-9]|1[0-3])$/.test(ks)) return renderKatha(ks, ki); return renderKathaIndex(); }
  if(h==='words' || h.startsWith('words/')) return renderWords(h.startsWith('words/') ? h.slice(6) : '');
  const pm = h.endsWith('~p');
  const [sid, idx] = (pm? h.slice(0,-2) : h).split('.');
  if(!DATA.sections[sid]) return renderHome();
  if(pm) return renderPaath(sid);
  renderVerse(sid, idx==null? 0 : indexFor(sid, idx));
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e=>{
  const cb = chant && e.target.closest('.paath [data-chant]'); if(cb){ jumpTo(cb); return; }
  const b = e.target.closest('[data-go]'); if(b){ go(b.dataset.go); return; }
  const sb = e.target.closest('[data-script]'); if(sb){ prefs.script=sb.dataset.script; applyPrefs(); if($('#sheetRoot').innerHTML) openSheet(); route(); }
});
$('#homeBtn').onclick = ()=>{ memo=false; reviewQ=null; go('#'); };
$('#menuBtn').onclick = openSheet;
$('#memoBtn').onclick = ()=>{ memo=!memo; if(!memo) reviewQ=null; route(); };
$('#paathBtn').onclick = ()=>{
  const h = decodeURIComponent(location.hash.slice(1)); const sid = h.replace(/~p$/,'').split('.')[0];
  if(paathMode){ const last=store.get('last',{}); go(sectionHash(sid, last.s===sid?last.i:0)); } else go('#'+sid+'~p');
};
document.addEventListener('keydown', e=>{
  if(e.target.closest('input')||$('#sheetRoot').innerHTML) return;
  if(document.querySelector('.done')) return;
  if(chant && e.key===' '){ e.preventDefault(); chant.playing ? pauseChant() : playChant(); return; }
  if(e.key==='ArrowRight'){ const n=$('#next'); n&&n.click(); }
  if(e.key==='ArrowLeft'){ const p=$('#prev'); p&&!p.disabled&&p.click(); }
});
function bindSwipe(sid, idx, len){
  let x0=null, y0=null, dx=0, horiz=null;
  const card = ()=>$('.leafcard');
  app.ontouchstart = e=>{ if(e.touches.length>1){ x0=null; return; } x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; horiz=null; };
  app.ontouchmove = e=>{
    if(x0===null) return;
    const mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
    if(horiz===null && (Math.abs(mx)>8 || Math.abs(my)>8)) horiz = Math.abs(mx) > Math.abs(my)*1.4;
    if(!horiz || !motionOK()) return;
    dx = (idx===0 && mx>0) ? mx*0.25 : mx;           /* resist at the first verse */
    const c=card(); if(!c) return;
    c.classList.add('dragging'); c.style.animation='none';
    c.style.transform=`translateX(${dx*0.7}px) rotate(${dx/60}deg)`; c.style.opacity = String(1-Math.min(.5, Math.abs(dx)/600));
  };
  app.ontouchend = e=>{
    if(x0===null) return;
    const fx=e.changedTouches[0].clientX-x0, fy=e.changedTouches[0].clientY-y0; x0=null;
    const c=card(), goNext = fx<-70 && Math.abs(fx)>1.6*Math.abs(fy), goPrev = fx>70 && Math.abs(fx)>1.6*Math.abs(fy) && idx>0;
    if(c && motionOK() && horiz){
      c.classList.remove('dragging'); c.classList.add('snap');
      if(goNext||goPrev){ c.style.transform=`translateX(${goNext?-120:120}%) rotate(${goNext?-4:4}deg)`; c.style.opacity='0';
        setTimeout(()=>$(goNext?'#next':'#prev').click(), 170); return; }
      c.style.transform=''; c.style.opacity=''; return;
    }
    if(goNext) $('#next').click(); else if(goPrev) $('#prev').click();
  };
}

/* ---------------- boot ---------------- */
applyPrefs();
Promise.all([
  fetch('data/text.json').then(r=>r.json()),
  fetch('data/notes/index.json').then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([d, idx])=>{ DATA=d; NOTEIDX=idx; route(); })
  .catch(()=>{ app.innerHTML='<div class="wrap loading">The text could not be loaded. Check your connection and reload.</div>'; });

if('serviceWorker' in navigator && location.protocol==='https:' && !/claude|claudeusercontent/.test(location.hostname)){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
})();
</script>
